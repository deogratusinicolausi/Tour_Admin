name: turiva_admin
description: "TURIVA Admin App - Management Portal"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  lottie: ^3.1.0
  flutter_svg: ^2.0.10

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3

  # Cloudinary
  cloudinary_public: ^0.23.1
  image_picker: ^1.1.2

  # State Management
  provider: ^6.1.2

  # Utilities
  http: ^1.2.2
  url_launcher: ^6.3.0
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.2

  # Charts
  fl_chart: ^0.69.0
  csv: ^6.0.0
  share_plus: ^10.1.1
  path_provider: ^2.1.5
  # PDF
  pdf: ^3.11.1
  printing: ^5.13.2

  # File Picker
  file_picker: ^8.1.2
  audioplayers: ^6.7.1
  vibration: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/fonts/NotoSans-Regular.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/turiva_admin_icon.png"
  min_sdk_android: 21